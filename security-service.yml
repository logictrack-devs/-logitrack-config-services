server:
  port: 8080

spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/logitrack_security?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true