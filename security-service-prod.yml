server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL}             # sin default -> exige env vars reales
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate       # nunca update en prod
      show-sql: false

logging:
  level:
    root: WARN
