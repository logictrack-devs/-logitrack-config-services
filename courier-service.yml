server:
  port: 8082

spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/logitrack_courier?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  public-key: "PENDIENTE_CLAVE_PUBLICA_RSA"